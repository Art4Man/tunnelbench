version: 2

project_name: tunnelbench

builds:
  - main: ./cmd/tunnelbench
    binary: tunnelbench
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, install.sh]

checksum:
  name_template: SHA256SUMS

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

release:
  # Tags like v0.1.1-rc.1 become GitHub pre-releases: "tunnelbench update -pre"
  # installs them, plain "update" and install.sh keep to the latest stable release.
  prerelease: auto
